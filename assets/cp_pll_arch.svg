<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="380" viewBox="0 0 1240 380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<style>.bx{fill:#161b22;stroke:#f0883e;stroke-width:2}.ext{fill:#0d1117;stroke:#8b949e;stroke-width:1.5;stroke-dasharray:5 4}
.n{fill:#e6edf3;font-size:15px;font-weight:700;text-anchor:middle}.s{fill:#8b949e;font-size:11.5px;text-anchor:middle}
.w{stroke:#30363d;stroke-width:2;fill:none}.f{stroke:#f0883e;stroke-width:2.5;fill:none;stroke-dasharray:7 11;animation:fl 1.1s linear infinite}
.se{fill:#8b949e;font-size:11.5px;text-anchor:end}.l{fill:#8b949e;font-size:12px}.p{fill:#d29922;font-size:13px;font-weight:700}
@keyframes fl{to{stroke-dashoffset:-18}}</style>
<rect width="1240" height="380" rx="14" fill="#0d1117"/>
<text x="28" y="34" fill="#e6edf3" font-size="16" font-weight="700">Integer-N charge-pump PLL architecture</text>
<text x="28" y="128" class="p" text-anchor="start">REF 2 MHz</text><path d="M120 123H170" class="w" marker-end="url(#a)"/><path d="M120 123H170" class="f"/><rect x="170" y="95" width="130" height="56" rx="8" class="bx"/><text x="235.0" y="119.0" class="n">PFD</text><text x="235.0" y="137.0" class="s">2-DFF + reset</text><path d="M300 112H360" class="w" marker-end="url(#a)"/><path d="M300 112H360" class="f"/><text x="312" y="104" class="l">UP</text><path d="M300 134H360" class="w" marker-end="url(#a)"/><path d="M300 134H360" class="f"/><text x="312" y="152" class="l">DN</text><rect x="360" y="95" width="160" height="56" rx="8" class="bx"/><text x="440.0" y="119.0" class="n">Charge pump</text><text x="440.0" y="137.0" class="s">matched, 50/100 µA</text><path d="M520 123H585" class="w" marker-end="url(#a)"/><path d="M520 123H585" class="f"/><rect x="585" y="88" width="170" height="70" rx="8" class="ext"/><text x="670.0" y="119.0" class="n">Loop filter</text><text x="670.0" y="137.0" class="s">R1 · C1 · C2</text><text x="670.0" y="151.0" class="s">off-chip</text><path d="M755 123H820" class="w" marker-end="url(#a)"/><path d="M755 123H820" class="f"/><text x="760" y="115" class="l">VCTRL</text><rect x="820" y="88" width="180" height="70" rx="8" class="bx"/><text x="910.0" y="119.0" class="n">Ring VCO</text><text x="910.0" y="137.0" class="s">5-stage current-</text><text x="910.0" y="151.0" class="s">starved, 20–50 MHz</text><path d="M1000 123H1050" class="w" marker-end="url(#a)"/><path d="M1000 123H1050" class="f"/><rect x="1050" y="95" width="110" height="56" rx="8" class="bx"/><text x="1105.0" y="128.0" class="n">Out drv</text><text x="1172" y="128" class="p" text-anchor="start">FOUT</text><path d="M910 158V250H690" class="w" marker-end="url(#a)"/><path d="M910 158V250H690" class="f"/><rect x="530" y="222" width="160" height="56" rx="8" class="bx"/><text x="610.0" y="246.0" class="n">Divider ÷N</text><text x="610.0" y="264.0" class="s">N = 10–25</text><path d="M530 250H235V151" class="w" marker-end="url(#a)"/><path d="M530 250H235V151" class="f"/><text x="300" y="242" class="l">FB</text><text x="585" y="330" class="p" text-anchor="start">N[4:0]</text><path d="M610 312V278" class="w" marker-end="url(#a)"/><path d="M610 312V278" class="f"/><rect x="170" y="300" width="200" height="56" rx="8" class="bx"/><text x="270.0" y="324.0" class="n">Lock detector</text><text x="270.0" y="342.0" class="s">4–10 ns window</text><path d="M280 250V300" class="w" marker-end="url(#a)"/><path d="M280 250V300" class="f"/><path d="M370 328H430" class="w" marker-end="url(#a)"/><path d="M370 328H430" class="f"/><text x="436" y="333" class="p" text-anchor="start">LOCK</text><text x="1215" y="268" class="se">40 MHz nominal · 30/30 PVT</text><text x="1215" y="286" class="se">jitter 17.5 ps rms (10 kHz–10 MHz)</text><text x="1215" y="304" class="se">lock ≤ 100 µs worst case</text>
</svg>